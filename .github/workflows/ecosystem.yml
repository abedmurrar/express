name: ecosystem

# Runs the own test suites of community middleware that test against Express
# (cors, express-session, multer, express-rate-limit, http-proxy-middleware,
# express-openapi-validator, express-fileupload, express-basic-auth, hpp,
# express-mongo-sanitize) on Express 5.3.0 and on
# this repository, and fails if any test that passes on 5.3.0 fails here.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'index.js'
      - 'index.mjs'
      - 'typings/**'
      - 'package.json'
      - 'tsconfig.build.json'
      - 'scripts/build.js'
      - 'scripts/ecosystem-suites.js'
      - '.github/workflows/ecosystem.yml'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suites:
    name: Middleware suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Build
        run: npm run build

      - name: Run the middleware suites
        env:
          ECOSYSTEM_CACHE: ${{ runner.temp }}/ecosystem
        run: npm run test:ecosystem-suites
