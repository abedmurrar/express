name: release

# Publishes to npm when a version tag is pushed. Tags are made by
# `npm run release`; see RELEASING.md. Adapted from the objection fork.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Check the tag and the package name
        id: version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$name" = "express" ]; then
            echo "The package is still named \"express\", which this fork can't publish. Rename it (for example @abedmurrar/express) first; see RELEASING.md."
            exit 1
          fi
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match the version $version in package.json."
            exit 1
          fi
          case "$version" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The repo's .npmrc sets ignore-scripts, so npm runs no prepack or
      # prepublish hook: build explicitly, then make sure the package holds it.
      - name: Build
        run: npm run build

      - name: Check the package contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map((f) => f.path)
            for (const need of ['index.js', 'index.mjs', 'lib/express.js', 'lib/router/index.js', 'lib/qs/index.js', 'lib/send/index.js', 'lib/serve-static/index.js', 'typings/index.d.ts', 'typings/index.d.mts', 'typings/core.d.ts']) {
              if (!files.includes(need)) { console.error('missing from the package: ' + need); process.exit(1) }
            }
            console.log(files.length + ' files packed')
          "

      # Trusted publishing: npm exchanges the OIDC token for a short-lived
      # credential, so no NPM_TOKEN secret is stored.
      - name: Publish to npm
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.dist-tag }}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          node scripts/changelog.js notes "$VERSION" > release-notes.md
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md $flags
