name: benchmark

# One full benchmark run per PR that touches code apps run (see ROADMAP.md,
# "Definition of done"). It compares the PR head with its base branch, the
# original Express 5.3.0 and other frameworks, writes the table to the run
# summary, and keeps the results files as an artifact.

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'index.js'
      - 'package.json'
      - 'benchmarks/**'
  workflow_dispatch:
    inputs:
      against:
        description: 'Git ref to compare with'
        required: false
        default: 'master'

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} ✨ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AGAINST: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || inputs.against }}
      NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'manual' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm --prefix benchmarks/compare install --no-audit --no-fund --no-package-lock

      - name: Run the benchmark
        run: node benchmarks/compare/run.ts --against "$AGAINST" --name "$NAME"

      - name: Write the summary
        if: always()
        run: |
          f="benchmarks/results/$NAME.md"
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "No results file: the run failed before writing it." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: |
            benchmarks/results/${{ env.NAME }}.md
            benchmarks/results/${{ env.NAME }}.json
          retention-days: 30
