name: mutation

# Mutation testing of the TypeScript sources in src/ with Stryker
# (stryker.config.json). Stryker mutates src/ in its sandbox and runs
# `npm run build` there, so the tests run against a lib/ built from the mutants.
# Pull requests run incrementally: only mutants whose code or covering tests
# changed since the last run are tested again. The weekly and manual runs test
# every mutant and refresh the incremental file that pull requests start from.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'tsconfig.build.json'
      - 'scripts/build.js'
      - 'vitest.config.js'
      - 'stryker.config.json'
      - '.github/workflows/mutation.yml'
  schedule:
    # Mondays at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} ✨ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  stryker:
    name: Stryker on src/
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --ignore-scripts --include=dev

      # Fails fast on a type or build error before the long Stryker run.
      - name: Build
        run: npm run build

      - name: Restore the incremental file
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-ts-${{ github.run_id }}
          restore-keys: stryker-incremental-ts-

      - name: Run Stryker
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            npx stryker run
          else
            npx stryker run --force
          fi

      - name: Save the incremental file
        if: always() && hashFiles('reports/stryker-incremental.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-ts-${{ github.run_id }}

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/
          retention-days: 30
