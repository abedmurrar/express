name: ci

on:
  push:
    branches:
      - master
      - develop
      - '4.x'
      - '5.x'
      - '5.0'
    paths-ignore:
      - '*.md'
  pull_request:
  workflow_dispatch:
  # lets release.yml run this matrix on a version tag
  workflow_call:

permissions:
  contents: read

# Cancel in progress workflows
# in the scenario where we already had a run going for that PR/branch/tag but then triggered a new run
concurrency:
  group: "${{ github.workflow }} ✨ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install --ignore-scripts --include=dev

      - name: Run lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  types:
    name: Public types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install --ignore-scripts --include=dev

      # attw packs the package, which needs the built lib/.
      - name: Build
        run: npm run build

      # tsc on test/types (strict, loose, and the compat snippets against
      # @types/express), then the type-size budget
      - name: Type tests
        run: npm run test:types

      # The same tests on the oldest and the latest TypeScript 5.x supported,
      # installed on their own in test/types/ts5 (the root tsc stays 7)
      - name: Install TypeScript 5.x
        run: npm run test:types:ts5:install

      - name: Type tests on TypeScript 5.x
        run: npm run test:types:ts5

      - name: Check the published types (attw)
        run: npm run attw

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24, 26]
        # Node.js release schedule: https://nodejs.org/en/about/releases/

    name: Node.js ${{ matrix.node-version }} - ${{matrix.os}}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Configure npm loglevel
        run: |
          npm config set loglevel error
        shell: bash

      # npm 10, bundled with Node 22, reads .npmrc's min-release-age but doesn't
      # apply it, so it installed releases younger than 7 days (router 2.3.0,
      # which made the comparisons with upstream differ on Node 22 only). Node
      # 24 and 26 bundle npm 11, which applies it; use a pinned npm 11 here too.
      - name: Use npm 11
        shell: bash
        run: |
          if [ "$(npm -v | cut -d. -f1)" -lt 11 ]; then npm install -g npm@11.13.0; fi

      - name: Install dependencies
        run: npm install

      - name: Output Node and NPM versions
        shell: bash
        run: |
          echo "Node.js version: $(node -v)"
          echo "NPM version: $(npm -v)"
          npm ls router --all

      # Coverage must stay at 100% (see .c8rc.json)
      - name: Run tests with coverage
        shell: bash
        run: npm run test-ci

      - name: Upload code coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-node-${{ matrix.node-version }}-${{ matrix.os }}
          path: ./coverage/lcov.info
          retention-days: 1

  coverage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lcov
        shell: bash
        run: sudo apt-get -y install lcov

      - name: Collect coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./coverage
          pattern: coverage-node-*

      - name: Merge coverage reports
        shell: bash
        run: find ./coverage -name lcov.info -exec printf '-a %q\n' {} \; | xargs lcov -o ./lcov.info

      - name: Upload coverage report
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: ./lcov.info
